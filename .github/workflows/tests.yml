name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: npm test

      - name: Install static analysis tools
        run: npm install --no-save --package-lock=false eslint@10 globals@16

      - name: Check undefined global references
        run: npx eslint --config tests/eslint.config.mjs "src/**/*.js"
