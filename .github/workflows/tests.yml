name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run existing regression checks
        run: npm test

      - name: Install pinned test tools
        run: npm install --no-save --package-lock=false eslint@10.12.0 globals@17.13.0 @playwright/test@1.64.0

      - name: Check undefined global references
        run: npx eslint --config tests/eslint.config.mjs "src/**/*.js"

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npx playwright test --config=tests/e2e/playwright.config.cjs

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bandabase-browser-test-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 5

  database-policy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bandabase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bandabase_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Test UPDATE RLS policy before and after the repair migration
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: bandabase_test
        run: node tests/db/band_list_item_policy.test.mjs
